[workspace]
members = ["crates/core", "crates/cli", "crates/gui", "crates/app"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
x2p-core = { path = "crates/core" }
x2p-cli = { path = "crates/cli" }
x2p-gui = { path = "crates/gui" }

calamine = "0.26"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
csv = "1.3"
encoding_rs = "0.8"
thiserror = "2"
zip = "2"
quick-xml = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = "0.44"
usvg = { version = "0.44", features = ["text"] }
tiny-skia = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui-kit = "0.7"
rfd = "0.15"
open = "5"

[profile.release]
opt-level = "z"     # optimize for size
lto = true          # link-time optimization
codegen-units = 1   # better optimization
panic = "abort"     # remove unwind tables
strip = true        # strip symbols

# GPUI 栈按性能优化：体积优先会让渲染、布局与文本排版明显变慢。
[profile.release.package.gpui-pre]
opt-level = 3
[profile.release.package."gpui-pre-platform"]
opt-level = 3
[profile.release.package.gpui-component]
opt-level = 3
[profile.release.package.gpui-kit]
opt-level = 3
[profile.release.package.gpui-kit-assets]
opt-level = 3
[profile.release.package.rustybuzz]
opt-level = 3
[profile.release.package.taffy]
opt-level = 3
[profile.release.package.ttf-parser]
opt-level = 3
