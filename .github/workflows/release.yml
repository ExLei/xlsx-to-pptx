name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-x86_64
          # GPUI 只支持 MSVC 目标，Windows 必须在 windows 上原生构建。
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: windows-x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: macos-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # gpui 的 Linux 后端需要这些系统库才能编译。
      - name: Install system deps (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libvulkan1

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          SUFFIX="${{ matrix.suffix }}"

          if [[ "${{ matrix.target }}" == *"linux"* ]]; then
            PKG="xlsx-to-pptx-${SUFFIX}"
            mkdir -p "${PKG}/DEBIAN" "${PKG}/usr/bin"
            cp 英语助记卡片生成 "${PKG}/usr/bin/"
            chmod 755 "${PKG}/usr/bin/英语助记卡片生成"
            printf 'Package: xlsx-to-pptx\nVersion: %s\nSection: utils\nPriority: optional\nArchitecture: amd64\nMaintainer: ExLei\nDescription: Excel/CSV to PPTX flashcard generator\n' "${VERSION}" > "${PKG}/DEBIAN/control"
            dpkg-deb --build "${PKG}" "${{ github.workspace }}/xlsx-to-pptx-${SUFFIX}.deb"
            ls -lh "${{ github.workspace }}/xlsx-to-pptx-${SUFFIX}.deb"

          elif [[ "${{ matrix.target }}" == *"apple"* ]]; then
            PKG_ROOT="pkg-root"
            mkdir -p "${PKG_ROOT}/usr/local/bin"
            cp 英语助记卡片生成 "${PKG_ROOT}/usr/local/bin/"
            chmod 755 "${PKG_ROOT}/usr/local/bin/英语助记卡片生成"
            pkgbuild --root "${PKG_ROOT}" \
              --identifier com.exlei.xlsx-to-pptx \
              --version "${VERSION}" \
              --install-location / \
              "${{ github.workspace }}/xlsx-to-pptx-${SUFFIX}.pkg"
            ls -lh "${{ github.workspace }}/xlsx-to-pptx-${SUFFIX}.pkg"

          else
            cp 英语助记卡片生成.exe "${{ github.workspace }}/xlsx-to-pptx-${SUFFIX}.exe"
            ls -lh "${{ github.workspace }}/xlsx-to-pptx-${SUFFIX}.exe"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xlsx-to-pptx-${{ matrix.suffix }}
          path: xlsx-to-pptx-${{ matrix.suffix }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xlsx-to-pptx-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: xlsx-to-pptx-*
