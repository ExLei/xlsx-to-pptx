[package]
name = "gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "英语助记卡片生成"
path = "src/main.rs"

[dependencies]
vocab_core = { path = "../core" }
cli = { path = "../cli" }
gpui-kit = "0.7"
rfd = "0.15"
open = "5"
serde_json = "1"

[dev-dependencies]
gpui-kit = { version = "0.7", features = ["test-support"] }
tempfile = "3"
encoding_rs = "0.8"


[build-dependencies]
winresource = "0.1"